
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aries13 | Natural Hair Extensions</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f0;
      color: #25211e;
    }
    header {
      padding: 24px;
      text-align: center;
      background: #211d1b;
      color: white;
      letter-spacing: 5px;
    }
    nav {
      padding: 16px;
      text-align: center;
    }
    nav a {
      margin: 0 12px;
      color: #25211e;
      text-decoration: none;
    }
    .hero {
      padding: 80px 20px;
      text-align: center;
      background: #e8ded2;
    }
    .hero h1 { font-size: 42px; }
    .hero p { font-size: 17px; }
    .products {
      padding: 40px 20px;
      text-align: center;
    }
    .product {
      display: inline-block;
      padding: 28px;
      margin: 10px;
      background: white;
      border-radius: 8px;
      max-width: 260px;
    }
    button {
      background: #29221e;
      color: white;
      border: 0;
      padding: 12px 20px;
      cursor: pointer;
    }
    footer {
      padding: 25px;
      text-align: center;
      background: #211d1b;
      color: white;
    }
  </style>
</head>
<body>
  <header>ARIES13</header>
  <nav>
    <a href="cos.html">Coșul meu</a>
    <a href="#produse">Produse</a>
    <a href="#despre">Despre noi</a>
    <a href="#contact">Contact</a>
  </nav>
  <a href="cont.html" style="
  display: inline-block;
  background: #25211e;
  color: #fff;
  padding: 12px 22px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
">Contul meu</a>
  <section class="hero">
    <h1>Your Hair. Your Power.</h1>
    <p>Extensii din păr natural, pentru frumusețea ta.</p>
    <a href="#produse"><button>Descoperă colecția</button></a>
  </section>
  <section class="products" id="produse">
    <h2>Colecția Aries13</h2>
    <div class="product" id="produs-0001">
  <p>Se încarcă produsul…</p>
</div>
    </div>
  </section>
  <section class="products" id="despre">
    <h2>Despre Aries13</h2>
    <p>Frumusețe naturală. Stil fără compromisuri.</p>
  </section>
  <footer id="contact">ARIES13 · Contact: completează adresa ta de e-mail</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
async function loadProduct() {
  const card = document.getElementById("produs-0001");

  try {
    const client = window.supabase.createClient(
      "https://snnaumexpevrobnbtebn.supabase.co",
      "sb_publishable_8OA3WK4gsMohLmL-lYZ80A_c3CnPAZ2"
    );

    const { data: product, error } = await client
      .from("products")
      .select("*")
      .eq("id", "0001")
      .maybeSingle();

    if (error) throw error;

    if (!product) {
      card.textContent = "Produsul nu este disponibil.";
      return;
    }

    card.replaceChildren();

    const image = document.createElement("img");
    image.src = product.image_url;
    image.alt = product.name;
    image.style.cssText =
      "width:100%;height:320px;object-fit:contain;border-radius:8px;";
    card.appendChild(image);

    function addText(tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      card.appendChild(element);
      return element;
    }

    addText("h3", product.name);
    addText("p", "Extensii din păr natural");
    addText("p", `${product.length_cm} cm · ${product.weight_g} g`);
    addText("p", `${product.color} · ${product.attachment}`);

    const price = addText("p", new Intl.NumberFormat("ro-RO", {
      style: "currency",
      currency: "RON"
    }).format(Number(product.price_ron)));
    price.style.cssText = "font-size:24px;font-weight:bold;";

    addText("p", product.stock > 0
      ? `Stoc: ${product.stock} bucăți`
      : "Stoc epuizat");

    const button = addText("button", product.stock > 0
  ? "Adaugă în coș"
  : "Stoc epuizat");

button.type = "button";
button.disabled = product.stock <= 0;

button.addEventListener("click", () => {
  try {
    const cart = JSON.parse(
      localStorage.getItem("aries13-cart") || "{}"
    );

    if (!cart || typeof cart !== "object" || Array.isArray(cart)) {
      throw new Error("Coș invalid");
    }

    const saved = cart[product.id];
    const quantity = Number.isInteger(saved) && saved > 0
      ? saved : 0;

    if (quantity >= product.stock || quantity >= 99) {
      alert("Ai atins cantitatea disponibilă pentru acest produs.");
      return;
    }

    cart[product.id] = quantity + 1;
    localStorage.setItem("aries13-cart", JSON.stringify(cart));
    window.location.href = "cos.html";
  } catch (error) {
    alert("Coșul nu a putut fi salvat în browser.");
  }
});
  } catch (error) {
    card.textContent =
      "Produsul nu s-a încărcat. Reîncarcă pagina.";
    console.error(error);
  }
}

loadProduct();
</script>
</body>
</html>
